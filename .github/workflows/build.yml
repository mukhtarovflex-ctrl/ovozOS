name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ovozos.zip
        run: |
          unzip -o ovozos.zip -d extracted_project
          if [ -f "extracted_project/build.gradle.kts" ] || [ -f "extracted_project/build.gradle" ]; then
            mv extracted_project/* .
          else
            SUBDIR=$(find extracted_project -mindepth 1 -maxdepth 1 -type d | head -n 1)
            mv "$SUBDIR"/* .
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ovozOS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
