
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ovozos.zip
        run: |
          unzip -o ovozos.zip.zip -d extracted_project
          if [ -f "extracted_project/build.gradle.kts" ]; then
            cp -a extracted_project/. .
          else
            SUBDIR=$(find extracted_project -mindepth 1 -maxdepth 1 -type d | head -n 1)
            cp -a "$SUBDIR"/. .
          fi

      - name: Check configuration
        run: |
          test -f .env.example
          grep -n 'KEYSTORE_PASSWORD' app/build.gradle.kts
          grep -n 'productionAppCheck' app/build.gradle.kts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore Permanent Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > debug.keystore
          test -s debug.keystore

      - name: Verify Store Password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v \
            -keystore debug.keystore \
            -storetype JKS \
            -storepass:env KEYSTORE_PASSWORD \
            -alias androiddebugkey

      - name: Verify Private Key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -certreq \
            -keystore debug.keystore \
            -storetype JKS \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEYSTORE_PASSWORD \
            -alias androiddebugkey \
            -file /tmp/ovozos-test.csr
          echo "Private key verified"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Build APK with Play Integrity
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle clean assembleDebug \
            -PproductionAppCheck=true \
            --no-configuration-cache \
            --no-build-cache \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ovozOS-apk
          path: app/build/outputs/apk/debug/*.apk
